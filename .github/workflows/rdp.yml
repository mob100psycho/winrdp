name: WinRDP
on: workflow_dispatch
jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty -Path ('HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp') -Name UserAuthentication -Value 0
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes

          $pw = ConvertTo-SecureString 'P@ssw0rd!' -AsPlainText -Force
          foreach ($name in @('runner', 'runneradmin')) {
            if (Get-LocalUser -Name $name -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name $name -Password $pw -PasswordNeverExpires $true
            } else {
              New-LocalUser -Name $name -Password $pw -FullName $name -PasswordNeverExpires $true
            }
            Enable-LocalUser -Name $name
            Add-LocalGroupMember -Group 'Administrators' -Member $name
            Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $name
          }

      - name: Tunnel via Pinggy
        shell: bash
        run: |
          while true; do
            ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R0:localhost:3389 tcp@free.pinggy.io 2>&1 | tee -a /tmp/pinggy.log
            sleep 5
          done
